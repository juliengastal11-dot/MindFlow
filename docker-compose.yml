# Déploiement sur un serveur (VPS) avec HTTPS automatique (Caddy + Let's Encrypt).
# 1. Pointez votre domaine (enregistrement A / AAAA) vers le serveur.
# 2. Copiez deploy/env.production.example en .env (à la racine) et remplissez DOMAIN et SECRET_KEY.
# 3. docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Définissez SECRET_KEY dans le fichier .env}
      FRONTEND_URL: https://${DOMAIN:?Définissez DOMAIN dans le fichier .env}
      COOKIE_SECURE: "true"
      SEED_DEMO: ${SEED_DEMO:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/oauth/calendar/callback
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
    volumes:
      - app-data:/app/backend/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:

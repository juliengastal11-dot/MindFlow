# Blueprint Render (https://render.com) : New → Blueprint → ce dépôt.
# Le disque persistant conserve la base SQLite entre les déploiements (offre Starter requise pour les disques).
services:
  - type: web
    name: mindflow
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: mindflow-data
      mountPath: /app/backend/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: FRONTEND_URL
        sync: false # à renseigner après le premier déploiement : https://mindflow.onrender.com
      - key: GOOGLE_REDIRECT_URI
        sync: false # https://mindflow.onrender.com/api/oauth/calendar/callback (si Google Calendar)

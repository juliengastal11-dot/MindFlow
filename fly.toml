# Fly.io : `fly launch --copy-config --no-deploy` puis voir DEPLOY.md.
# Une seule machine (base SQLite sur volume) : `fly scale count 1`.
app = "mindflow-business"
primary_region = "cdg"

[build]

[env]
  PORT = "8080"
  COOKIE_SECURE = "true"
  SEED_DEMO = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "mindflow_data"
  destination = "/app/backend/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
